[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dispatch-os"
version = "0.1.0"
description = "Agentic Service Dispatch OS scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.24",
  "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
